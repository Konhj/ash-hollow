name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path settings.py -Pattern 'VERSION = "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          echo "VER=$ver" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "AshHollow-v${{ steps.version.outputs.VER }}" --icon icon.ico --add-data "fonts;fonts" main.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "dist\AshHollow-v${{ steps.version.outputs.VER }}.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "Game exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Name "AshHollow*" -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshHollow-windows-x64-v${{ steps.version.outputs.VER }}
          path: dist/AshHollow-v${{ steps.version.outputs.VER }}.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/AshHollow-v${{ steps.version.outputs.VER }}.exe" `
            --title "Ash Hollow ${{ github.ref_name }}" `
            --generate-notes
