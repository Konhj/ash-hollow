name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name AshHollow --icon icon.ico --add-data "fonts;fonts" main.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "dist\AshHollow.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "Game exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Name "AshHollow" -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshHollow-windows-x64
          path: dist/AshHollow.exe
